<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gestor de Tareas - Organiza y gestiona tus tareas diarias de manera eficiente."
    />
    <meta name="author" content="Maximiliano Exequiel Ordoñez" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Gestor De Tareas</title>
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-expand-lg bg-body-tertiary shadow border-bottom"
      >
        <div class="container">
          <a class="navbar-brand" href="/index.html">Organizador De Tareas</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="/index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link git-btn"
                  href="https://github.com/Maxii34/Organizador-de-Tareas"
                  ><i class="bi bi-github mx-1 fs-6 icon-btn"></i>Repocitorio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link git-btn" href="https://github.com/Maxii34/"
                  ><i class="bi bi-person-lines-fill mx-1 fs-6 icon-btn"></i>
                  Perfil Github</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="container">
      <section class="mt-5">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
              <!-- Título -->
              <h1 class="text-center my-4">Organiza tu día</h1>
              <p class="text-center text-muted mb-4">
                Añade tareas y gestioná tus pendientes fácilmente
              </p>

              <!-- Input y botón para añadir tarea -->
              <div class="card shadow mb-4">
                <div class="card-body">
                  <div class="input-group">
                    <input
                      type="text"
                      id="inputTarea"
                      class="form-control"
                      placeholder="Introduce una nueva tarea..."
                      aria-label="Nueva tarea"
                    />
                    <button
                      class="btn btn-primary"
                      id="btnAñadir"
                      aria-label="Añadir tarea"
                    >
                      <i class="fas fa-plus"></i> Añadir
                    </button>
                  </div>
                </div>
              </div>

              <!-- Lista de tareas -->
              <div class="card shadow">
                <div class="card-header bg-primary text-white">
                  <h3 class="mb-0">Lista de Tareas</h3>
                </div>
                <div class="card-body">
                  <div class="text-center my-2">
                    Bienvenido a tu organizador de tareas✨
                  </div>

                  <ul class="list-group" id="listaTareas">
                    <!-- Las tareas se añadirán aquí dinámicamente -->
                    <li
                      class="list-group-item text-center text-muted"
                      id="mensajeVacio"
                    >
                      No hay tareas pendientes
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="container mt-4">
        <div class="row justify-content-center"></div>
      </section>
    </main>
    <footer class="mt-5">
      <div
        class="d-flex justify-content-center align-items-center bg-dark text-white py-3"
      >
        <p class="mb-0">© 2025 | Todos los derechos reservados.</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="/js/app.js"></script>
  </body>
</html>
